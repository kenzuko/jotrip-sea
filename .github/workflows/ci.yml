name: JoTrip Sea CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/sea-ui-foundation

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate routes, links and preview guardrails
        run: python scripts/validate_static.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/booking.js
