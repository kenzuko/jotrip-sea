name: JoTrip Sea Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages preview
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets experiences data _site/
          touch _site/.nojekyll
          find _site -name '*.html' -type f -print0 | xargs -0 sed -i 's|="/|="/jotrip-sea/|g'
          sed -i "s|'/assets/|'\/jotrip-sea\/assets\/|g" _site/assets/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
